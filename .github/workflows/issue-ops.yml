name: Journal Club — issue ops

# Processes claim forms and /claim /withdraw /extend /confirm comments, plus the
# organizer-only /received and /reject. Who may run what is issue_ops.COMMAND_ACL.
# Follows the repo's mutate-and-push pattern (cf. the website calendar.yml):
# run Python -> commit the updated state -> push back, with a rebase retry loop
# so two issues processed at once never clobber each other.

on:
  issues:
    types: [opened, edited, closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

# Queue pushes from this workflow; do NOT cancel queued runs (each carries a distinct
# user action). `queue: max` is the load-bearing word: the default is `queue: single`,
# under which a THIRD run arriving while one is in flight silently CANCELS the queued
# second — a participant's command vanishing with no comment and no error.
#
# This group is a contention/noise optimisation, NOT the correctness mechanism. It
# demonstrably did not serialise issues #36 and #37 on 2026-07-31 (run 30667267903
# started 12 s before run 30667257761 finished). Correctness is the rebase-retry loop
# plus the post-after-push ordering below.
concurrency:
  group: jc-state-push
  queue: max
  cancel-in-progress: false

jobs:
  dispatch:
    # Two guards. The first: never react to the bot's own actions (its comments, its
    # auto-close on withdraw).
    #
    # The second: paper suggestions belong to suggest-ops.yml, and this engine must never
    # see one. Until the suggestion form existed, the ONLY label check lived in
    # issue_ops.py, so every issue in the repo started the claim engine and was saved
    # solely by its body containing no slash-command token. That is thin: _detect_consent
    # reads any `- [x]` in the body as GDPR consent and _detect_attribution reads the word
    # "anonymous" as an attribution choice, which is how #26 answered a bug report quoting
    # "FMRI-01" with a consent rejection. Filtering here makes the separation structural
    # rather than a property of what someone happened to type.
    if: >-
      github.actor != 'github-actions[bot]'
      && !contains(github.event.issue.labels.*.name, 'paper-suggestion')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Apply the issue/command to state
        id: apply
        env:
          # REQUIRED repo variable — Settings → Secrets and variables → Actions →
          # Variables, or `gh variable set ORGANIZERS --body "handle1,handle2"`.
          # If it is not set this renders as an empty string, which issue_ops.py reads
          # as an empty roster: every /received, /reject and organizer-driven /withdraw
          # is then refused, and the refusal is indistinguishable from a normal
          # permissions decision. That is exactly what happened until 2026-08-17.
          ORGANIZERS: ${{ vars.ORGANIZERS }}
        run: python scripts/issue_ops.py

      # ----------------------------------------------------------------------
      # PUSH BEFORE YOU SPEAK — issue #40.
      #
      # The retry loop below re-applies the intent on top of the fetched tip, which
      # REWRITES comment.md and actions.json. Everything that talks to the participant
      # therefore runs AFTER this step. It did not, until 2026-08-17: on 2026-07-31 the
      # first, discarded attempt told issue #37 "EEG-03 claimed — due 2026-08-12" while
      # the attempt that actually landed had rejected the claim. claims/37.json still
      # reads "papers": {}.
      #
      # Two invariants this ordering depends on, both easy to break by accident:
      #   * issue_ops.main() rewrites BOTH artifacts on every invocation, including its
      #     early returns — so the re-run always replaces them;
      #   * both are git-ignored, so `git reset --hard` leaves them for the re-run to
      #     overwrite rather than deleting them.
      # ----------------------------------------------------------------------
      - name: Commit + push state (rebase-retry loop)
        id: push
        env:
          # Read by the re-run below. In the step env rather than inline on the command,
          # so a repo variable is never interpolated into a shell string.
          ORGANIZERS: ${{ vars.ORGANIZERS }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          branch="${GITHUB_REF#refs/heads/}"
          git add claims docs/data/status.json
          if git diff --cached --quiet; then
            # handle_event took an early return (silent no-op, not-your-thread, missing
            # consent): nothing to persist. There may still be a reply to post, and the
            # announce step runs regardless of what this step decides.
            echo "no state change"; exit 0
          fi
          git commit -m "jc: issue #${{ github.event.issue.number }} state update"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$branch"; then exit 0; fi
            echo "push rejected, rebasing (attempt $i)"
            git fetch origin
            # re-apply intent on the fetched tip; this also regenerates comment.md
            git reset --hard "origin/$branch"
            python scripts/issue_ops.py
            git add claims docs/data/status.json
            if git diff --cached --quiet; then
              echo "::notice::re-applied intent is already on origin; nothing left to push"
              exit 0
            fi
            git commit -m "jc: issue #${{ github.event.issue.number }} state update (retry $i)"
            sleep $((RANDOM % 5 + 1))
          done
          echo "::error::could not push state after retries"; exit 1

      # Only now do comment.md and actions.json describe what is on origin/main. This
      # step carries no `if:` on purpose — the default success() guard is what skips it
      # when the push failed. Do not "fix" that with `if: always()`.
      - name: Announce — comment, labels, close
        id: announce
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/announce.py issue-ops

      # Gated on the push specifically, not on failure() alone: an apply-step crash may
      # leave no actions.json and may not even be a claim thread, and apologising on
      # someone's bug report would be worse than saying nothing.
      - name: Tell the participant nothing was recorded
        if: failure() && steps.push.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/announce.py failed
